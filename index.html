<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
      /* Photo-led SAFAR home advertisement slides: keep the established interface, avoid a synthetic full-screen mockup. */
      .hero {
        border: 1px solid rgba(165, 143, 255, 0.32);
        background: #05060b;
        box-shadow:
          0 16px 42px rgba(0, 0, 0, 0.42),
          0 0 22px rgba(93, 83, 220, 0.1);
      }
      .slide {
        background-repeat: no-repeat;
        background-color: #05060b;
        background-blend-mode: normal;
        isolation: isolate;
      }
      .slide-photo {
        position: absolute !important;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 48%;
        z-index: -2 !important;
        display: block;
        filter: saturate(1.04) contrast(1.03);
      }
      .slide::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(
            90deg,
            rgba(3, 4, 10, 0.92) 0%,
            rgba(3, 4, 10, 0.76) 38%,
            rgba(3, 4, 10, 0.28) 74%,
            rgba(3, 4, 10, 0.12) 100%
          ),
          linear-gradient(0deg, rgba(3, 4, 10, 0.48), transparent 55%);
        z-index: -1;
      }
      .slide > *:not(.slide-photo) {
        position: relative;
        z-index: 1;
      }
      @media (max-width: 600px) {
        .slide-photo {
          object-position: 62% center;
        }
        .slide::before {
          background:
            linear-gradient(90deg, rgba(3, 4, 10, 0.88), rgba(3, 4, 10, 0.54)),
            linear-gradient(0deg, rgba(3, 4, 10, 0.45), transparent);
        }
      }
    </style>
    <style id="safar-liquid-upgrade">
      :root {
        color-scheme: dark;
        --bg: #080910;
        --surface: rgba(19, 20, 35, 0.88);
        --surface-2: rgba(31, 30, 51, 0.9);
        --ink: #f7f5ff;
        --ink-2: #b5b4cf;
        --line: rgba(190, 183, 255, 0.2);
        --brand: #a78bfa;
        --brand-ink: #100d20;
        --brand-soft: rgba(167, 139, 250, 0.17);
        --accent: #ffd166;
        --accent-soft: rgba(255, 209, 102, 0.14);
        --good: #6ee7b7;
        --good-soft: rgba(110, 231, 183, 0.14);
        --warn: #ffd166;
        --warn-soft: rgba(255, 209, 102, 0.14);
        --bad: #ff7b91;
        --bad-soft: rgba(255, 123, 145, 0.14);
        --low: #a5b4fc;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
      }
      html {
        background: #080910;
        scroll-behavior: smooth;
      }
      body {
        color: var(--ink);
        background:
          radial-gradient(
            ellipse at 12% 5%,
            rgba(112, 70, 220, 0.22),
            transparent 32%
          ),
          radial-gradient(
            ellipse at 92% 18%,
            rgba(65, 143, 220, 0.17),
            transparent 30%
          ),
          radial-gradient(
            ellipse at 70% 75%,
            rgba(225, 64, 103, 0.1),
            transparent 28%
          ),
          radial-gradient(
            ellipse at 18% 90%,
            rgba(255, 193, 75, 0.07),
            transparent 24%
          ),
          #080910;
        background-attachment: fixed;
      }
      body::before {
        background: #100d20;
      }
      .top,
      .emp .top {
        background: linear-gradient(
          120deg,
          rgba(13, 12, 27, 0.96),
          rgba(38, 25, 70, 0.94) 48%,
          rgba(18, 36, 59, 0.96)
        );
        border-bottom: 1px solid rgba(180, 155, 255, 0.24);
        box-shadow: 0 12px 38px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
      }
      .brand-home {
        appearance: none;
        border: 0;
        background: transparent;
        color: inherit;
        padding: 5px 8px 5px 0;
        border-radius: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 11px;
        text-align: left;
        transition:
          transform 0.22s,
          background 0.22s,
          filter 0.22s;
        min-width: 0;
      }
      .brand-home:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.07);
        filter: drop-shadow(0 0 15px rgba(167, 139, 250, 0.35));
      }
      .brand-home:active {
        transform: translateY(1px) scale(0.97);
      }
      .brand-home .mark {
        width: 44px;
        height: 44px;
        filter: drop-shadow(0 5px 12px rgba(167, 139, 250, 0.25));
        transition: transform 0.35s;
      }
      .brand-home:hover .mark {
        transform: rotate(-8deg) scale(1.06);
      }
      .brand-copy {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .brand-name {
        font-size: 25px;
        letter-spacing: 0.13em;
        color: #fff;
      }
      .brand-sub {
        font-size: 10.5px;
        max-width: 280px;
        color: #c9c4e7;
      }
      .brand-refresh {
        font-size: 21px;
        color: #d7c8ff;
        margin-left: 2px;
        transition: transform 0.4s;
      }
      .brand-home:hover .brand-refresh {
        transform: rotate(180deg);
      }
      .roles {
        gap: 10px;
      }
      .seg {
        padding: 4px;
        gap: 4px;
        border-radius: 14px;
        background: rgba(7, 8, 18, 0.55);
        border: 1px solid rgba(198, 180, 255, 0.23);
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .seg button {
        border-radius: 10px;
        padding: 10px 13px;
        font-size: 11px;
        letter-spacing: 0.055em;
        color: #d4d0eb;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .seg button[aria-pressed="true"] {
        background: linear-gradient(135deg, #c4b5fd, #8b5cf6 55%, #7c3aed);
        color: #100d20;
        box-shadow:
          0 5px 18px rgba(139, 92, 246, 0.38),
          inset 0 1px rgba(255, 255, 255, 0.7);
        transform: translateY(-1px);
      }
      .tabs {
        gap: 9px;
        padding: 13px 0 15px;
        overflow-x: auto;
        scrollbar-width: thin;
        scrollbar-color: #7054b8 transparent;
      }
      .tab {
        border: 1px solid rgba(196, 181, 253, 0.16);
        border-bottom: 1px solid rgba(196, 181, 253, 0.16);
        border-radius: 13px;
        padding: 11px 16px;
        background: linear-gradient(
          145deg,
          rgba(45, 39, 70, 0.92),
          rgba(19, 19, 34, 0.96)
        );
        color: #c7c3df;
        box-shadow:
          0 5px 0 rgba(4, 4, 12, 0.75),
          0 8px 18px rgba(0, 0, 0, 0.24),
          inset 0 1px rgba(255, 255, 255, 0.1);
        transition:
          transform 0.18s,
          box-shadow 0.18s,
          border-color 0.18s,
          background 0.18s;
        position: relative;
      }
      .tab:hover {
        transform: translateY(-2px);
        color: white;
        border-color: rgba(196, 181, 253, 0.5);
        box-shadow:
          0 7px 0 rgba(4, 4, 12, 0.7),
          0 12px 24px rgba(139, 92, 246, 0.15),
          inset 0 1px rgba(255, 255, 255, 0.14);
      }
      .tab:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 rgba(4, 4, 12, 0.8);
      }
      .tab[aria-current="page"] {
        color: #fff;
        border-color: rgba(196, 181, 253, 0.7);
        border-bottom: 1px solid rgba(196, 181, 253, 0.7);
        background: linear-gradient(
          135deg,
          rgba(124, 58, 237, 0.65),
          rgba(48, 48, 88, 0.95) 70%,
          rgba(45, 91, 130, 0.55)
        );
        box-shadow:
          0 0 0 1px rgba(167, 139, 250, 0.14),
          0 5px 0 #171126,
          0 12px 28px rgba(124, 58, 237, 0.22),
          inset 0 1px rgba(255, 255, 255, 0.25);
      }
      .count {
        background: rgba(255, 255, 255, 0.13);
        color: #fff;
      }
      .card {
        background: linear-gradient(
          145deg,
          rgba(26, 26, 45, 0.93),
          rgba(14, 15, 27, 0.94)
        );
        border: 1px solid rgba(190, 183, 255, 0.17);
        box-shadow:
          0 14px 35px rgba(0, 0, 0, 0.24),
          inset 0 1px rgba(255, 255, 255, 0.045);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .job {
        border-color: rgba(190, 183, 255, 0.18);
      }
      .job:hover {
        box-shadow:
          0 18px 40px rgba(0, 0, 0, 0.38),
          0 0 0 1px rgba(167, 139, 250, 0.16);
      }
      .btn {
        background: linear-gradient(145deg, #27253d, #171725);
        border-color: rgba(190, 183, 255, 0.23);
        color: #f7f5ff;
        box-shadow:
          0 4px 0 rgba(0, 0, 0, 0.35),
          inset 0 1px rgba(255, 255, 255, 0.07);
        transition:
          transform 0.18s,
          box-shadow 0.18s,
          filter 0.18s;
      }
      .btn:hover {
        background: linear-gradient(145deg, #35304f, #222039);
        transform: translateY(-1px);
        filter: brightness(1.08);
      }
      .btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
      }
      .btn.primary,
      .emp .btn.primary {
        background: linear-gradient(120deg, #c4b5fd, #9b7af8 48%, #7c3aed);
        border-color: rgba(221, 214, 254, 0.65);
        color: #120d23;
        box-shadow:
          0 5px 0 #241744,
          0 9px 22px rgba(124, 58, 237, 0.25),
          inset 0 1px rgba(255, 255, 255, 0.65);
      }
      .btn.primary:hover,
      .emp .btn.primary:hover {
        filter: brightness(1.1);
      }
      input[type="text"],
      input[type="number"],
      input[type="search"],
      select,
      textarea {
        background: rgba(8, 9, 19, 0.82);
        border-color: rgba(190, 183, 255, 0.23);
        color: var(--ink);
      }
      select option {
        background: #151426;
        color: #fff;
      }
      .chip {
        background: rgba(35, 34, 55, 0.9);
        border-color: rgba(190, 183, 255, 0.17);
        color: #d6d3ed;
      }
      .chip.have,
      .btn[aria-pressed="true"] {
        background: rgba(167, 139, 250, 0.2);
        color: #eee8ff;
      }
      .guide {
        background: linear-gradient(
          120deg,
          rgba(124, 58, 237, 0.2),
          rgba(52, 135, 198, 0.12)
        );
      }
      .prof-hero {
        background: linear-gradient(
          120deg,
          rgba(124, 58, 237, 0.22),
          rgba(30, 38, 61, 0.85)
        );
      }
      .avatar {
        background: linear-gradient(135deg, #8b5cf6, #438ad6, #e45e82);
      }
      .emp-hero {
        background-color: #19152d;
      }
      .emp .top .mk-dot {
        fill: #282047;
      }
      .lst,
      .listing,
      .thr {
        background: linear-gradient(145deg, #201e35, #121320);
        color: var(--ink);
        border-color: rgba(190, 183, 255, 0.2);
      }
      .lst[aria-pressed="true"],
      .listing[aria-pressed="true"],
      .thr[aria-pressed="true"] {
        background: linear-gradient(
          135deg,
          rgba(124, 58, 237, 0.28),
          rgba(39, 68, 100, 0.4)
        );
        border-color: #a78bfa;
      }
      .col {
        background: rgba(26, 25, 43, 0.85);
        border: 1px solid rgba(190, 183, 255, 0.12);
      }
      .chat-log {
        background: rgba(8, 9, 17, 0.75);
      }
      .msg.them {
        background: #211f35;
        border-color: rgba(190, 183, 255, 0.16);
      }
      .msg.me,
      .emp .msg.me {
        background: linear-gradient(135deg, #7652cf, #405fa9);
        color: #fff;
      }
      .nextbar {
        background: rgba(124, 58, 237, 0.14);
        border-color: rgba(190, 183, 255, 0.15);
      }
      .overlay {
        background: rgba(3, 3, 10, 0.76);
        backdrop-filter: blur(9px);
      }
      .sheet {
        background: linear-gradient(145deg, #1d1b31, #0e0f1b);
        border: 1px solid rgba(190, 183, 255, 0.2);
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
      }
      footer.wrap {
        color: #aaa7c5;
      }
      footer b {
        color: #f7f5ff;
      }
      @media (max-width: 700px) {
        .bar {
          align-items: flex-start;
        }
        .brand-home .mark {
          width: 38px;
          height: 38px;
        }
        .brand-name {
          font-size: 22px;
        }
        .brand-sub {
          display: none;
        }
        .brand-refresh {
          font-size: 18px;
        }
        .roles {
          margin-left: auto;
        }
        .seg button {
          padding: 8px 9px;
          font-size: 9px;
          letter-spacing: 0;
        }
        .tabs {
          margin-inline: -2px;
          padding-block: 12px 15px;
          gap: 7px;
        }
        .tab {
          font-size: 12px;
          padding: 10px 13px;
          flex: none;
        }
        .page-title {
          font-size: clamp(24px, 6vw, 30px);
        }
      }
      @media (max-width: 390px) {
        .roles-label {
          display: none;
        }
        .seg button {
          max-width: 118px;
          white-space: normal;
          line-height: 1.2;
        }
        .brand-home {
          gap: 7px;
        }
        .brand-name {
          font-size: 20px;
        }
        .tab {
          padding: 9px 11px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
          animation: none !important;
        }
      }
    </style>

    <style id="safar-fixes">
      /* Slide text stays white in light theme (slides sit on dark photos) */
      html[data-theme="light"] .hero .slide,
      html[data-theme="light"] .hero .slide h2,
      html[data-theme="light"] .hero .slide .kick,
      html[data-theme="light"] .hero .slide .sub,
      html[data-theme="light"] .hero .slide .tag,
      html[data-theme="light"] .hero .ringbox .ring span,
      html[data-theme="light"] .hero .ringbox .score small {
        color: #fff !important;
      }
      html[data-theme="light"] .hero .slide .cta {
        color: #0b3f44 !important;
      }
      /* Selected state for skill pickers (Post a job + Student profile) */
      html button.chip[aria-pressed="true"] {
        background: #a94f49 !important;
        border-color: #a94f49 !important;
        color: #fff !important;
        box-shadow: 0 3px 10px rgba(169, 79, 73, 0.3) !important;
      }
      html button.chip[aria-pressed="true"]::before {
        content: "\2713\00a0";
        font-weight: 700;
      }
      html button.chip[aria-pressed="false"]:hover {
        border-color: rgba(169, 79, 73, 0.7) !important;
        cursor: pointer;
      }
    </style>
    <style id="safar-auth-ui">
      .roles { flex-wrap: wrap; row-gap: 8px; }
      .who { display: inline-flex; flex-direction: column; line-height: 1.15; max-width: 170px; padding: 0 6px; }
      .who b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .who small { font-size: 11px; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.06em; }
      .seg button[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
      .auth-wrap { display: flex; justify-content: center; padding: 18px 0 40px; }
      .auth-card { width: 100%; max-width: 540px; }
      .authseg { display: flex; margin: 12px 0 0; }
      .authseg button { flex: 1; }
      .auth-card form { margin-top: 14px; }
      .field-err, #au-error:empty, #pj-error:empty { display: none; }
      body.anon .ringbox, body.anon .why { display: none; }
      body.anon .chip.need, body.anon .chip.have { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
      @media (max-width: 600px) { .who { display: none; } }
    </style>

    <style>
      /* Layout: sticky header with role switch and tabs, a centred 1080px column, job cards in an auto-fill grid, bottom-sheet job details on phones.
   Palette: Dal Lake teal for structure, saffron for the brand mark and highlights, snow-blue neutrals. */
      :root {

        --good-soft: #dcf1e6;
        --warn: #9a6a0b;
        --warn-soft: #fbebc8;
        --low: #5d7077;
        --bad: #b03e2d;
        --bad-soft: #f8ddd8;
        --shadow:
          0 1px 2px rgba(16, 37, 42, 0.06), 0 4px 14px rgba(16, 37, 42, 0.05);
        --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;

        --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      }

        :root:not([data-theme="light"]) {

          --surface: #132428;
          --surface-2: #1b3238;
          --ink: #e6f1f1;
          --ink-2: #97b0b5;
          --line: #284248;
          --brand: #4fc3cb;
          --brand-ink: #06262a;
          --brand-soft: #17383d;
          --accent: #f2b33d;
          --accent-soft: #3a2e10;
          --good: #53c98f;
          --good-soft: #143b2b;
          --warn: #e2b04e;
          --warn-soft: #3a2e10;
          --low: #8ca3a9;
          --bad: #f0806c;
          --bad-soft: #42211c;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0c1a1d;
        --surface: #132428;
        --surface-2: #1b3238;
        --ink: #e6f1f1;
        --ink-2: #97b0b5;
        --line: #284248;
        --brand: #4fc3cb;
        --brand-ink: #06262a;
        --brand-soft: #17383d;
        --accent: #f2b33d;
        --accent-soft: #3a2e10;
        --good: #53c98f;
        --good-soft: #143b2b;
        --warn: #e2b04e;
        --warn-soft: #3a2e10;
        --low: #8ca3a9;
        --bad: #f0806c;
        --bad-soft: #42211c;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--f-body);
        font-size: 15px;
        line-height: 1.5;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        background: var(--surface);
        z-index: 30;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: var(--f-display);
        line-height: 1.15;
        margin: 0;
        text-wrap: balance;
        letter-spacing: -0.01em;
      }
      p,
      ul,
      ol,
      dl,
      dd {
        margin: 0;
      }
      ul,
      ol {
        padding: 0;
        list-style: none;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .wrap {
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      main.wrap {
        padding-block: 20px 40px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .muted {
        color: var(--ink-2);

      .mono {

      }
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }

      /* header */
      .top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;

        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .mark {

        height: 34px;
        flex: none;
      }
      .mk-bg {
        fill: var(--brand);
      }
      .mk-line {
        fill: none;

        fill: var(--brand-ink);
      }

        font-family: var(--f-display);
        font-weight: 800;
        font-size: 22px;

        line-height: 1;
      }
      .brand-sub {
        font-size: 11px;
        color: var(--ink-2);
        line-height: 1.2;
        max-width: 260px;
      }
      .roles {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .roles-label {
        font-size: 12px;
        color: var(--ink-2);
      }

        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface-2);
      }
      .seg button {
        border: 0;
        background: transparent;
        padding: 7px 12px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        color: var(--ink-2);
      }
      .seg button[aria-pressed="true"] {
        background: var(--brand);
        color: var(--brand-ink);
      }
      .tabs {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        padding-block: 0;
      }
      .tab {
        border: 0;
        background: transparent;
        padding: 10px 12px;
        font-weight: 600;
        font-size: 14px;
        color: var(--ink-2);
        cursor: pointer;
        border-bottom: 3px solid transparent;
        white-space: nowrap;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .tab[aria-current="page"] {
        color: var(--ink);
        border-bottom-color: var(--accent);
      }
      .count {
        font-family: var(--f-mono);
        font-size: 11px;

        border-radius: 999px;
        padding: 1px 7px;
        color: var(--ink);
      }

      /* basics */
      .page-title {
        font-size: 26px;
        font-weight: 700;
      }

        color: var(--ink-2);

      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        box-shadow: var(--shadow);
        min-width: 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 40px;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--surface-2);
      }
      .btn.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--brand-ink);
      }
      .btn.primary:hover {
        filter: brightness(1.08);
      }
      .btn.small {
        min-height: 34px;
        padding: 5px 10px;
        font-size: 13px;
      }
      .btn[aria-pressed="true"] {
        background: var(--brand-soft);
        border-color: var(--brand);
        color: var(--ink);
      }
      .btn.icon {
        min-width: 40px;
        padding: 0;
        font-size: 20px;

      }

        border-color: transparent;
        color: var(--ink);

      .chip.have::before {
        content: "\2713\00a0";

        font-weight: 700;
      }
      .chip.need::before {
        content: "+\00a0";

      }
      button.chip {

        font-size: 13.5px;

        color: var(--brand-ink);

        background: var(--surface-2);
        color: var(--ink-2);

      }

      }
      .st-Hired {

        color: var(--good);
      }

        background: var(--bad-soft);

        color: var(--ink);

      /* discover */
      .strip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .strip p {
        min-width: 0;
      }
      .filters {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .filters .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .filters .grow {
        flex: 1 1 220px;
        min-width: 0;
      }
      .filters select {
        width: auto;
        min-width: 0;
        flex: 0 1 auto;
      }
      .check {
        display: inline-flex;

        align-items: center;

      .check input {
        width: 18px;
        height: 18px;
        accent-color: var(--brand);

      .results-head {

        justify-content: space-between;

        gap: 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
        gap: 14px;
      }
      .job {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .job-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .job-main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .meta-line {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .sector {
        font-size: 12.5px;
        color: var(--ink-2);
      }
      .job h3 {
        font-size: 18px;
        font-weight: 700;
      }
      .employer {
        font-size: 13.5px;
        color: var(--ink-2);
      }
      .facts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 14px;
      }
      .facts div {
        min-width: 0;
      }
      .facts dt {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--ink-2);
        font-weight: 600;
      }
      .facts dd {
        font-size: 14px;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .facts dd.pay {
        font-family: var(--f-mono);
        font-size: 13.5px;
      }
      .why {
        font-size: 12.5px;
        color: var(--ink-2);
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: auto;
        flex-wrap: wrap;
      }

        flex: 1 1 auto;
      }

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;

      }

        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--ink-2);
        font-weight: 600;
      }
      .ring {

      .ring.hi .val {

      }
      .ring.mid .val {
        stroke: var(--warn);
      }
      .ring.lo .val {
        stroke: var(--low);
      }
      .ring span {
        font-family: var(--f-mono);
        font-weight: 600;
        font-size: 15px;
      }

        gap: 12px;
        align-items: center;

        color: var(--ink-2);

        display: flex;
        flex-direction: column;
        gap: 16px;
      }

        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
        gap: 12px;
      }

        font-size: 17px;
        margin-bottom: 4px;
      }
      .card .sub {
        font-size: 13.5px;
        color: var(--ink-2);
        margin-bottom: 12px;
      }

        display: grid;
        grid-template-columns: minmax(52px, auto) repeat(7, minmax(0, 1fr));
        gap: 6px;
        align-items: center;
      }
      .avail .dh {
        font-size: 12px;
        font-weight: 600;
        text-align: center;
        color: var(--ink-2);
      }

        display: flex;
        flex-direction: column;
        line-height: 1.2;
        padding-right: 6px;

        font-size: 12.5px;
        font-weight: 600;
      }

        font-size: 10.5px;
        font-style: normal;
        color: var(--ink-2);
      }

        place-items: center;

      .cell[aria-pressed="true"] {
        background: var(--brand);
        border-color: var(--brand);
      }
      .cell[aria-pressed="true"]::after {
        content: "\2713";
        color: var(--brand-ink);
        font-weight: 700;
        font-size: 14px;
      }

        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
        gap: 10px;
      }
      .rules div {
        background: var(--surface-2);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13.5px;
      }
      .rules b {
        font-family: var(--f-mono);
        font-size: 18px;
        display: block;
      }

      /* applications */
      .list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .app {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .app-head h3 {
        font-size: 17px;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
      }
      .steps li {
        position: relative;
        padding-top: 18px;

        color: var(--ink-2);
        font-weight: 500;
      }
      .steps li::before {
        content: "";

        left: 0;

        height: 11px;
        border-radius: 50%;

      }
      .steps li::after {
        content: "";
        position: absolute;
        top: 4px;
        left: 11px;
        right: -4px;
        height: 3px;
        background: var(--line);
      }

        display: none;

      .steps li.cur::before {

        color: var(--ink);

      }
      .closed {
        font-size: 13.5px;
        color: var(--ink-2);
      }

        color: var(--ink-2);

        background: var(--surface);
        cursor: pointer;

        background: var(--brand-soft);
        border-color: var(--brand);

        font-family: var(--f-display);
        font-size: 16px;
      }
      .listing span {
        font-size: 12.5px;
        color: var(--ink-2);
      }
      .applicant {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .ap-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }
      .ap-head h4 {
        font-size: 16px;
      }
      .note {
        font-size: 13.5px;
        color: var(--ink-2);
        font-style: italic;
        overflow-wrap: anywhere;
      }
      .status-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .status-row label {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .status-row select {
        width: auto;
        min-width: 150px;
      }
      .you {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        background: var(--accent-soft);
        color: var(--warn);
        padding: 1px 6px;
        border-radius: 4px;
      }
      .err {
        color: var(--bad);
        font-size: 13.5px;
        font-weight: 600;
        min-height: 1.2em;

      /* modal */
      body.lock {
        overflow: hidden;
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(8, 20, 24, 0.55);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0
          env(safe-area-inset-left, 0px);
      }
      .sheet {
        width: 100%;
        max-width: 640px;
        max-height: 92%;
        overflow-y: auto;
        background: var(--surface);
        border-radius: 16px 16px 0 0;
        padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      @media (min-width: 700px) {
        .overlay {
          align-items: center;
        }
        .sheet {
          border-radius: 16px;
          max-height: 88%;
          padding-bottom: 20px;
        }
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .sheet h2 {
        font-size: 23px;
        margin: 6px 0 2px;
      }
      .sheet h3 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--ink-2);
        margin-bottom: 8px;
      }
      .desc {
        max-width: 62ch;
      }
      .break {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .brow {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr) 54px;
        gap: 10px;
        align-items: center;
        font-size: 13.5px;
      }
      .brow .track {
        height: 8px;
        border-radius: 4px;
        background: var(--surface-2);
        overflow: hidden;
      }
      .brow .fill {
        height: 100%;
        background: var(--brand);
        border-radius: 4px;
      }
      .brow .pts {
        font-family: var(--f-mono);
        font-size: 12.5px;
        text-align: right;
      }
      .break-top {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-bottom: 10px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 20px);
        background: var(--ink);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
        z-index: 60;
        max-width: calc(100% - 32px);
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (prefers-reduced-motion: reduce) {
        .toast {
          transition: none;
        }
      }
      footer.wrap {
        padding-block: 8px calc(28px);
        color: var(--ink-2);
        font-size: 12.5px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      footer b {
        font-family: var(--f-display);
        color: var(--ink);
        font-size: 14px;
      }
      @media (max-width: 520px) {
        .brand-sub {
          display: none;
        }
        .avail .sl i {
          display: none;
        }
        .avail {
          gap: 4px;
        }
        .page-title {
          font-size: 23px;
        }
        .roles-label {
          display: none;
        }
      }

      /* v2 refresh */
      body {
        background:
          radial-gradient(
            1100px 380px at 90% -60px,
            var(--brand-soft),
            transparent 70%
          ),
          var(--bg);
      }
      body::before {
        background: #0b5f66;
      }
      .top {
        background: linear-gradient(135deg, #0b5f66, #0b6e75 55%, #12858a);
        border-bottom: 0;
        box-shadow: 0 6px 24px rgba(11, 110, 117, 0.25);
      }
      .top .brand-name {
        color: #fff;
      }
      .top .brand-sub,
      .top .roles-label {
        color: rgba(255, 255, 255, 0.85);
      }
      .top .mk-bg {
        fill: #fff;
      }
      .top .mk-dot {
        fill: #0b6e75;
      }
      .top .seg {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.3);
      }
      .top .seg button {
        color: #e8f6f6;
      }
      .top .seg button[aria-pressed="true"] {
        background: #fff;
        color: #0b5f66;
      }
      .tab {
        color: rgba(255, 255, 255, 0.8);
      }
      .tab:hover {
        color: #fff;
      }
      .tab[aria-current="page"] {
        color: #fff;
        border-bottom-color: var(--accent);
      }
      .count {
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
      }
      .card {
        border-radius: 16px;
      }
      .btn {
        border-radius: 10px;
      }
      .btn.primary {
        box-shadow: 0 4px 12px rgba(11, 110, 117, 0.28);
      }
      .page-title {
        font-size: 30px;
        font-weight: 800;
      }
      .sec-title {
        font-size: 20px;
        font-weight: 700;
        margin-top: 6px;
      }
      .job {
        position: relative;
        overflow: hidden;
        padding-top: 21px;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .job::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 5px;
        background: var(--brand);
      }
      .job.t-gig::before {
        background: var(--accent);
      }
      .job.t-seasonal::before {
        background: var(--good);
      }
      .job:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px rgba(16, 37, 42, 0.14);
      }
      .prof-hero {
        display: flex;
        gap: 18px;
        align-items: center;
        background: linear-gradient(135deg, var(--brand-soft), var(--surface));
      }
      .avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0b6e75, #12858a);
        color: #fff;
        font: 800 26px var(--f-display);
        display: grid;
        place-items: center;
        flex: none;
      }
      /* job slider */
      .hero {
        position: relative;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 14px 34px rgba(11, 110, 117, 0.28);
        color: #fff;
      }
      .hero-track {
        display: flex;
        transition: transform 0.6s cubic-bezier(0.22, 0.8, 0.24, 1);
      }
      .slide {
        flex: 0 0 100%;
        min-width: 0;
        position: relative;
        overflow: hidden;
        padding: 26px 26px 74px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 280px;
        background: linear-gradient(135deg, #0b5f66, #13808a);
      }
      .slide:nth-child(5n + 2) {
        background: linear-gradient(135deg, #5b3a9e, #8e3f9c);
      }
      .slide:nth-child(5n + 3) {
        background: linear-gradient(135deg, #9a3f0a, #b85a08);
      }
      .slide:nth-child(5n + 4) {
        background: linear-gradient(135deg, #1f4e8c, #2d6fb5);
      }
      .slide:nth-child(5n + 5) {
        background: linear-gradient(135deg, #1b6b4a, #2b8a5e);
      }
      .slide::after {
        content: "";
        position: absolute;
        right: -70px;
        bottom: -90px;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        pointer-events: none;
      }
      .slide > * {
        position: relative;
        z-index: 1;
      }
      .slide .kick {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.92;
        padding-right: 84px;
      }
      .slide h2 {
        font-size: clamp(26px, 4.6vw, 38px);
        font-weight: 800;
        padding-right: 84px;
      }
      .slide .sub {
        font-size: 15.5px;
        opacity: 0.95;
      }
      .slide .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .slide .tag {
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.32);
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
      }
      .slide .cta {
        align-self: flex-start;
        background: #fff;
        color: #0b3f44;
        border: 0;
        font-weight: 700;
        padding: 11px 20px;
        border-radius: 12px;
        min-height: 44px;
        cursor: pointer;
        margin-top: 4px;
      }
      .slide .cta:hover {
        filter: brightness(0.95);
      }
      .ringbox {
        position: absolute !important;
        right: 20px;
        top: 20px;
        z-index: 2;
      }
      .ringbox .ring span {
        color: #fff;
      }
      .ringbox .ring .trk {
        stroke: rgba(255, 255, 255, 0.3);
      }
      .ringbox .ring .val {
        stroke: #fff !important;
      }
      .ringbox .score small {
        color: rgba(255, 255, 255, 0.92);
      }
      .hero-ctrl {
        position: absolute;
        left: 26px;
        right: 20px;
        bottom: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 3;
      }
      .dots {
        display: flex;
        gap: 8px;
      }
      .dot {
        position: relative;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        border: 0;
        padding: 0;
        background: rgba(255, 255, 255, 0.5);
        cursor: pointer;
        transition:
          width 0.3s,
          background 0.3s;
      }
      .dot::after {
        content: "";
        position: absolute;
        inset: -14px -4px;
      }
      .dot[aria-current="true"] {
        width: 28px;
        background: #fff;
      }
      .arrows {
        display: flex;
        gap: 8px;
      }
      .arrow {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.45);
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
      }
      .arrow:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .hero :focus-visible {
        outline-color: #fff;
      }
      @media (prefers-reduced-motion: reduce) {
        .hero-track,
        .job,
        .dot {
          transition: none;
        }
      }
      @media (max-width: 520px) {
        .slide {
          padding: 22px 18px 74px;
        }
        .hero-ctrl {
          left: 18px;
          right: 14px;
        }
        .prof-hero {
          flex-direction: column;
          align-items: flex-start;
        }
      }

      /* v3: full width, scene backgrounds, employer board, chat */
      :root {
        --gut: clamp(16px, 3vw, 40px);
      }
      html,
      body {
        overflow-x: clip;
      }
      .wrap {
        max-width: none;
        padding-left: max(var(--gut), env(safe-area-inset-left, 0px));
        padding-right: max(var(--gut), env(safe-area-inset-right, 0px));
      }
      .hero,
      .emp-hero {
        margin-inline: calc(var(--gut) * -1);
        border-radius: 0;
      }
      .slide {
        min-height: 360px;
        padding: 34px calc(var(--gut) + 6px) 86px;
      }
      .slide h2 {
        font-size: clamp(30px, 5vw, 52px);
      }
      .slide .kick,
      .slide h2 {
        padding-right: 96px;
      }
      .hero-ctrl {
        left: calc(var(--gut) + 6px);
        right: var(--gut);
      }
      .ringbox {
        right: var(--gut);
        top: 26px;
        background: rgba(8, 24, 32, 0.5);
        border-radius: 14px;
        padding: 6px 10px;
      }
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      }
      .job {
        padding-top: 16px;
      }
      .job .cover {
        position: relative;
        margin: -16px -16px 4px;
        height: 124px;
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: flex-end;
        padding: 10px 14px;
      }
      .job .cover::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0) 40%,
          rgba(0, 0, 0, 0.4)
        );
      }
      .cover-in {
        position: relative;
        z-index: 1;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .sector-tag {
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        background: rgba(0, 0, 0, 0.45);
        padding: 2px 9px;

      }
      .job .ringbox {
        right: 12px;
        top: 12px;
        z-index: 2;
      }
      .m-cover {
        margin: -20px -20px 0;
        height: 140px;
        background-size: cover;
        background-position: center;
        flex: none;
      }
      @media (max-width: 520px) {
        .slide {
          min-height: 340px;
        }
      }
      /* employer */
      body.emp::before {
        background: #1b2559;
      }
      .emp .top {
        background: linear-gradient(135deg, #1b2559, #2a3c8c 55%, #3a52b5);
        box-shadow: 0 6px 24px rgba(27, 37, 89, 0.3);
      }
      .emp .top .seg button[aria-pressed="true"] {
        color: #1b2559;
      }
      .emp .top .mk-dot {
        fill: #2a3c8c;
      }
      .emp .btn.primary {
        background: #3a52b5;
        border-color: #3a52b5;
        color: #fff;
        box-shadow: 0 4px 12px rgba(58, 82, 181, 0.3);
      }
      .emp .msg.me {
        background: #2a3c8c;
        color: #fff;
      }
      .emp-hero {
        position: relative;
        color: #fff;
        padding: 30px calc(var(--gut) + 6px);
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-end;
        flex-wrap: wrap;
        min-height: 190px;
      }
      .emp-hero h1 {
        font-size: clamp(26px, 4vw, 42px);

        font-weight: 700;
        letter-spacing: 0.1em;

        display: flex;

      .emp-actions .btn:not(.primary) {

        border-color: rgba(255, 255, 255, 0.45);
        color: #fff;
      }
      .lst-row {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
        gap: 12px;

      .lst {
        display: flex;

      .board {

      .col {

      .ap-top {

      }

          days
            .split(",")

        const $ = (s, r = document) => r.querySelector(s);

              ({
                "&": "&amp;",

              })[c],

                /* ---------- server data ----------
           Accounts, jobs, applications and messages now live on the SAFAR server (SQLite) and are read and
           written through window.SafarAPI. The browser only holds a short-lived copy so it can draw the page. */
        const API = window.SafarAPI;
        const auth = { user: null, biz: null, meta: null, bizDirty: new Set() };
        let booting = true;
        let busy = false;
        const roleOf = () => (auth.user ? auth.user.role : null);
        const isStudent = () => roleOf() === "student";
        const isBusiness = () => roleOf() === "employer";
        const isAdmin = () => roleOf() === "admin";
        const roleName = (r) => (r === "employer" ? "business" : r);
        const guidePref = () => {
          try {
            return localStorage.getItem("safar-guide-dismissed") === "1";
          } catch (e) {
            return false;
          }
        };
        const emptyData = () => ({
          profile: { name: "", study: "", location: "Srinagar", skills: [], availability: [] },
          jobs: [],
          saved: [],
          applications: [],
          threads: [],
          guideDismissed: guidePref(),
        });
        const sid = (x) => (x == null ? null : String(x));
        const normJob = (j) => Object.assign({}, j, { id: sid(j.id), ownerId: sid(j.ownerId) });
        const normApp = (a) => Object.assign({}, a, { id: sid(a.id), jobId: sid(a.jobId), studentId: sid(a.studentId) });
        const normThread = (t, role) => {
          const unread = { student: 0, employer: 0 };
          unread[role] = t.unread || 0;
          return {
            id: sid(t.id),
            jobId: sid(t.jobId),
            studentId: sid(t.studentId),
            who: role === "student" ? "me" : t.studentName,
            msgs: t.messages || [],
            unread,
          };
        };
        const withoutJob = ({ job, ...rest }) => rest;
        function syncEmployer() {
          EMPLOYER.id = isBusiness() ? String(auth.user.id) : "";
          EMPLOYER.name = auth.biz ? auth.biz.name : "";
          EMPLOYER.town = auth.biz ? auth.biz.town : "";
        }
        async function loadAll() {
          const jobs = new Map();
          const add = (j) => {
            const n = normJob(j);
            jobs.set(n.id, Object.assign(jobs.get(n.id) || {}, n));
          };
          for (let off = 0; off < 500; off += 100) {
            const r = await API.listJobs({ sort: "new", limit: 100, offset: off });
            r.jobs.forEach(add);
            if (off + 100 >= r.total) break;
          }
          const next = emptyData();
          if (isStudent()) {
            const [apps, saved, th] = await Promise.all([API.myApplications(), API.listSaved(), API.threadsWithMessages()]);
            apps.forEach((a) => a.job && add(a.job));
            saved.forEach(add);
            const p = auth.user.profile;
            next.profile = { name: p.name, study: p.study, location: p.location, skills: p.skills.slice(), availability: p.availability.slice() };
            next.saved = saved.map((j) => String(j.id));
            next.applications = apps.map((a) => normApp(withoutJob(a)));
            next.threads = th.threads.map((t) => normThread(t, "student"));
          } else if (isBusiness()) {
            const [mine, apps, th, biz] = await Promise.all([API.myListings(), API.applicants(), API.threadsWithMessages(), API.getBusinessProfile()]);
            mine.forEach(add);
            auth.biz = biz;
            auth.bizDirty.clear();
            next.applications = apps.map(normApp);
            next.threads = th.threads.map((t) => normThread(t, "employer"));
          }
          // A conversation can belong to a closed listing that is not in the public list.
          for (const t of next.threads) {
            if (!jobs.has(t.jobId)) {
              try {
                add(await API.getJob(Number(t.jobId)));
              } catch (e) {}
            }
          }
          next.jobs = [...jobs.values()];
          data = next;
          syncEmployer();
        }
        async function refreshInbox() {
          if (isStudent()) {
            const [apps, th] = await Promise.all([API.myApplications(), API.threadsWithMessages()]);
            data.applications = apps.map((a) => normApp(withoutJob(a)));
            data.threads = th.threads.map((t) => normThread(t, "student"));
          } else if (isBusiness()) {
            const [apps, th] = await Promise.all([API.applicants(), API.threadsWithMessages()]);
            data.applications = apps.map(normApp);
            data.threads = th.threads.map((t) => normThread(t, "employer"));
          }
        }
        function resetSession() {
          auth.user = null;
          auth.biz = null;
          auth.bizDirty.clear();
          data = emptyData();
          syncEmployer();
          ui.thread = null;
          ui.selectedListing = null;
          ui.modalJobId = null;
          ui.draft = blankDraft();
        }
        const landing = () => (isStudent() ? "profile" : isBusiness() ? "dash" : "discover");
        const syncRole = () => {
          ui.role = isBusiness() ? "employer" : "student";
        };
        function viewAllowed(v) {
          if (v === "login") return !auth.user;
          if (v === "discover") return !isBusiness();
          if (isStudent()) return ["saved", "applications", "messages", "profile"].includes(v);
          if (isBusiness()) return ["dash", "post", "messages", "profile"].includes(v);
          return false;
        }
        function fail(e, fallback) {
          if (e && e.status === 401) return; // the session ended; onUnauthorized already told the user
          toast((e && e.message) || fallback || "Something went wrong. Please try again.");
        }
        async function run(fn) {
          if (busy) return;
          busy = true;
          try {
            return await fn();
          } catch (e) {
            fail(e);
          } finally {
            busy = false;
          }
        }
        function openLogin(role, mode, note) {
          ui.login = {
            role: role === "employer" ? "employer" : "student",
            mode: mode || "login",
            note: note || "",
            email: (ui.login && ui.login.email) || "",
            error: "",
          };
          ui.view = "login";
          if (ui.modalJobId) {
            ui.modalJobId = null;
            renderModal();
          }
          render();
        }
        // Signed-in users keep their role until they log out. Clicking the other profile button never switches.

        function locScore(jobLoc, userLoc) {
          if (jobLoc === "Remote") return 1;
          if (jobLoc === userLoc) return 1;
          if (NEAR.some((p) => p.includes(jobLoc) && p.includes(userLoc)))
            return 0.7;
          if (REGION[jobLoc] && REGION[jobLoc] === REGION[userLoc]) return 0.4;
          return 0;
        }
        function locLabel(job, l) {
          if (job.location === "Remote") return "Remote";

            ? "Same town"

              : l === 0.4
                ? "Same region"
                : "Different region";
        }
        function score(job, p) {
          const need = job.skills || [],
            have = new Set(p.skills || []);
          const matched = need.filter((s) => have.has(s)),
            missing = need.filter((s) => !have.has(s));
          const sk = need.length ? matched.length / need.length : 1;
          const l = locScore(job.location, p.location);
          const sched = job.schedule || [],
            av = new Set(p.availability || []);
          const fit = sched.filter((k) => av.has(k)).length;
          const a = sched.length ? fit / sched.length : 1;
          const pts = {
            skills: Math.round(sk * 50),
            loc: Math.round(l * 30),
            avail: Math.round(a * 20),
          };
          return {
            total: pts.skills + pts.loc + pts.avail,
            pts,
            sk,
            l,
            a,
            matched,
            missing,
            fit,
            slots: sched.length,
          };
        }

        function rangeDays(idxs) {
          const out = [];
          let i = 0;
          while (i < idxs.length) {
            let j = i;
            while (j + 1 < idxs.length && idxs[j + 1] === idxs[j] + 1) j++;
            out.push(
              j - i >= 2
                ? DAYS[idxs[i]] + "–" + DAYS[idxs[j]]
                : idxs
                    .slice(i, j + 1)
                    .map((k) => DAYS[k])
                    .join(", "),
            );
            i = j + 1;
          }
          return out.join(", ");
        }
        function when(keys) {
          if (!keys || !keys.length) return "Flexible hours";
          const byDay = {};
          keys.forEach((k) => {
            const [d, s] = k.split("-");

          });
          const groups = {};
          DAYS.forEach((d, i) => {
            if (!byDay[d]) return;
            const sl = SLOTS.filter((s) => byDay[d].has(s.id)).map((s) => s.id);
            const key = sl.join("+");
            (groups[key] = groups[key] || { sl, days: [] }).days.push(i);
          });
          return Object.values(groups)
            .map(
              (g) =>
                rangeDays(g.days) +
                " · " +
                (g.sl.length === 3 ? "All day" : g.sl.join(" + ")),
            )

        async function submitAuth(form) {
          const L = ui.login,
            fd = new FormData(form),
            g = (k) => String(fd.get(k) || "").trim();
          const email = g("email"),
            password = String(fd.get("password") || ""),
            reg = L.mode === "register";
          const show = (m) => {
            L.error = m;
            const el = $("#au-error");
            if (el) el.textContent = m;
          };
          let msg = "";
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) msg = "Enter a valid email address.";
          else if (!password) msg = "Enter your password.";
          else if (reg && password.length < 8) msg = "Use a password of at least 8 characters.";
          else if (reg && L.role === "student" && !g("name")) msg = "Enter your name.";
          else if (reg && L.role === "employer" && g("company").length < 2) msg = "Enter your business name.";
          else if (reg && L.role === "employer" && !g("contact")) msg = "Enter the contact person's name.";
          if (msg) return show(msg);
          if (busy) return;
          busy = true;
          const btn = form.querySelector('button[type="submit"]'),
            label = btn.textContent;
          btn.disabled = true;
          btn.textContent = reg ? "Creating account…" : "Signing in…";
          show("");
          let user;
          try {
            if (!reg) user = await API.login(email, password, L.role);
            else if (L.role === "student") {
              user = await API.register({ role: "student", name: g("name"), email, password });
              try {
                const patch = { location: g("location") || "Srinagar" };
                if (g("study")) patch.study = g("study");
                await API.saveProfile(patch);
                user = await API.me();
              } catch (e) {}
            } else
              user = await API.register({
                role: "employer", name: g("contact"), email, password,
                companyName: g("company"), town: g("town"), phone: g("phone"), description: g("desc"),
              });
          } catch (e) {
            busy = false;
            btn.disabled = false;
            btn.textContent = label;
            show(problems(e));
            return;
          }
          auth.user = user;
          try {
            await loadAll();
          } catch (e) {
            toast("Signed in, but some data could not be loaded. Please refresh.");
          }
          busy = false;
          L.error = "";
          L.email = "";
          syncRole();
          ui.filters.sort = isStudent() ? "match" : "new";
          ui.view = landing();
          render();

        }

        document.addEventListener("click", (e) => {
          const t = e.target.closest("[data-action]");
          if (!t) return;
          const a = t.dataset.action;
          if (a === "brand-refresh") {
            window.location.reload();
            return;
          }
          if (a === "toggle-theme") {
            setSafarTheme(
              document.documentElement.dataset.theme === "light"
                ? "dark"
                : "light",

          if (a === "hero-go") {
            goHero(+t.dataset.i);

          if (a === "hero-prev") {
            goHero(ui.slide - 1);
            return;
          }
          if (a === "hero-next") {
            goHero(ui.slide + 1);
            return;
          }
          if (a === "msg-job") {
            if (!gate("student", "message employers")) return;
            run(async () => {
              const th = await API.openThread(Number(t.dataset.id));
              await refreshInbox();
              ui.thread = String(th.id);
              ui.view = "messages";
              closeModal();
              render();
            });

              await refreshInbox();
              ui.thread = String(th.id);
              ui.view = "messages";
              render();

            return;

          if (a === "open-thread") {

            sendMessage(t.dataset.text);

          if (
            a === "shortlist" ||
            a === "propose-interview" ||
            a === "send-offer"
          ) {
            const th = data.threads.find((x) => x.id === ui.thread);
            if (!th) return;
            if (a === "propose-interview") {
              proposeInterview(th);

              sendOffer(th);
              return;

              await API.setStatus(Number(ap.id), "Shortlisted");

              render(true);
              toast("Shortlisted. You can now propose interview times.");

            return;

          if (a === "close-modal-bg") {
            if (e.target === t) closeModal();
            return;

          if (a === "profile-btn") {
            openProfile(t.dataset.role);
            return;

            doLogout();
            return;
          }
          if (a === "go-login") {
            openLogin(t.dataset.role, t.dataset.mode);
            return;
          }
          if (a === "login-role") {
            ui.login.role = t.dataset.role;
            ui.login.error = "";
            render(true);
            return;
          }
          if (a === "login-mode") {
            ui.login.mode = t.dataset.mode;
            ui.login.error = "";
            render(true);
            return;

              ui.view = v;

                // pick up anything that changed since the last load (new messages, status changes)
                const before = inboxSig();

            return;
          }
          if (a === "open-job") {
            openJob(t.dataset.id);
            return;
          }
          if (a === "close-modal") {
            closeModal();
            return;
          }
          if (a === "toggle-save") {
            if (!gate("student", "save jobs")) return;
            const id = t.dataset.id,
              on = !data.saved.includes(id);
            run(async () => {
              if (on) await API.save(Number(id));
              else await API.unsave(Number(id));
              toggleIn(data.saved, id);
              toast(on ? "Saved. Find it under Saved." : "Removed from Saved.");
              render(true);
              if (ui.modalJobId) renderModal();
            });
            return;
          }
          if (a === "apply") {
            const job = jobById(t.dataset.id);
            if (!job) return;
            if (!gate("student", "apply for jobs")) return;
            if (myApp(job.id)) return;
            const note = ($("#apply-note") || { value: "" }).value.trim();
            run(async () => {
              await API.apply(Number(job.id), note);
              await refreshInbox();
              render(true);
              renderModal();
              toast("Application sent to " + job.employer + ".");
            });
            return;
          }
          if (a === "toggle-slot") {
            const k = t.dataset.key,
              arr =
                t.dataset.scope === "post"
                  ? ui.draft.schedule
                  : data.profile.availability;
            const on = toggleIn(arr, k);
            t.setAttribute("aria-pressed", on);
            if (t.dataset.scope === "profile") {
              queueProfileSave();
              const c = $("#slot-count");
              if (c) c.textContent = slotCount();
            }
            return;
          }
          if (a === "toggle-skill") {
            const s = t.dataset.skill,
              arr =
                t.dataset.scope === "post"
                  ? ui.draft.skills
                  : data.profile.skills;
            const on = toggleIn(arr, s);
            t.setAttribute("aria-pressed", on);
            if (t.dataset.scope === "profile") queueProfileSave();
            return;
          }
          if (a === "filter-type") {
            ui.filters.type = t.dataset.type;
            document
              .querySelectorAll('[data-action="filter-type"]')
              .forEach((b) => b.setAttribute("aria-pressed", b === t));
            renderJobList();
            return;
          }
          if (a === "clear-filters") {
            ui.filters = {
              q: "",
              type: "All",
              loc: "All",
              fit: false,
              sort: ui.filters.sort,
            };
            render(true);
            return;
          }
          if (a === "select-listing") {
            ui.selectedListing = t.dataset.id;
            render(true);
            return;
          }
          if (a === "dismiss-guide") {
            data.guideDismissed = true;
            try {
              localStorage.setItem("safar-guide-dismissed", "1");
            } catch (err) {}
            render(true);
            return;
          }
        });
        function onField(e) {
          const el = e.target,
            id = el.id;
          if (id === "pj-photo") {
            readPhoto(el.files[0], (d) => {
              ui.draft.img = d;
              const pv = $("#pj-prev");
              if (pv) {
                pv.style.background = "url('" + d + "') center/cover";
                pv.hidden = false;
              }
            });
            return;
          }
          if (el.dataset.photoJob) {
            const jb = jobById(el.dataset.photoJob);
            readPhoto(el.files[0], (d) => {
              run(async () => {
                await API.updateJob(Number(jb.id), { img: d });
                jb.img = d;
                render(true);
                toast("Photo updated.");
              });
            });
            return;
          }
          if (id === "q") {
            ui.filters.q = el.value;
            renderJobList();
            return;
          }
          if (id === "loc") {
            ui.filters.loc = el.value;
            renderJobList();
            return;
          }
          if (id === "sort") {
            ui.filters.sort = el.value;
            renderJobList();
            return;
          }
          if (id === "fit") {
            ui.filters.fit = el.checked;
            renderJobList();
            return;
          }
          if (id === "pf-name") {
            data.profile.name = el.value;
            queueProfileSave();
            return;
          }
          if (id === "pf-study") {
            data.profile.study = el.value;
            queueProfileSave();
            return;
          }
          if (id === "pf-loc") {
            data.profile.location = el.value;
            queueProfileSave();
            return;
          }
          if (el.dataset.appId) {
            const app = data.applications.find((a) => a.id === el.dataset.appId);
            if (!app) return;
            run(async () => {
              try {
                await API.setStatus(Number(app.id), el.value);
                await refreshInbox();
                toast(app.applicant.name + " is now " + el.value.toLowerCase() + ".");
              } finally {
                render(true);
              }
            });
            return;
          }
          if (id === "au-email") {
            ui.login.email = el.value;
            return;
          }
          if (BP_FIELDS[id] && auth.biz) {
            auth.biz[BP_FIELDS[id][0]] = el.value;
            auth.bizDirty.add(BP_FIELDS[id][0]);
            queueBizSave();
            return;
          }
          if (el.dataset.draft) {
            ui.draft[el.dataset.draft] = el.value;
          }
        }
        document.addEventListener("input", (e) => {
          const el = e.target;
          if (
            el.tagName === "SELECT" ||
            el.type === "checkbox" ||
            el.type === "file"
          )
            return;
          onField(e);
        });
        document.addEventListener("change", (e) => {
          const el = e.target;
          if (
            el.tagName === "SELECT" ||
            el.type === "checkbox" ||
            el.type === "file"
          )
            onField(e);
        });
        document.addEventListener("submit", (e) => {
          if (e.target.id === "chat-form") {
            e.preventDefault();
            const inp = $("#chat-input"),
              v = inp ? inp.value.trim() : "";
            if (v) sendMessage(v);
            return;
          }
          if (e.target.id === "auth-form") {
            e.preventDefault();
            submitAuth(e.target);
            return;
          }
          if (e.target.id !== "post-form") return;
          e.preventDefault();
          const d = ui.draft,
            min = Number(d.min),
            max = Number(d.max),
            err = $("#pj-error");
          let msg = "";
          if (!d.title.trim()) msg = "Add a job title.";
          else if (!(min > 0) || !(max >= min))
            msg = "Enter a pay range where the top is at least the bottom.";
          else if (!d.skills.length)
            msg = "Pick at least one skill so students can be matched.";
          if (msg) {
            err.textContent = msg;
            return;
          }
          run(async () => {
            try {
              const job = await API.postJob({
                title: d.title.trim(), location: d.location, type: d.type, sector: d.sector,
                pay: [min, max], unit: d.unit, skills: d.skills.slice(), schedule: d.schedule.slice(),
                desc: d.desc.trim(), img: d.img || "",
              });
              data.jobs.unshift(normJob(job));
              ui.selectedListing = String(job.id);
              ui.draft = blankDraft();
              ui.view = "dash";
              render();
              toast("Published. Students can now see it in Discover.");
            } catch (e2) {
              if (e2.status !== 401) err.textContent = problems(e2);
            }
          });
        });
        document.addEventListener("keydown", (e) => {
          if (!ui.modalJobId) return;
          if (e.key === "Escape") {
            closeModal();
            return;
          }
          if (e.key === "Tab") {
            const f = [
              ...document.querySelectorAll(
                ".sheet button,.sheet textarea,.sheet [href]",
              ),
            ].filter((x) => !x.disabled);
            if (!f.length) return;
            const first = f[0],
              last = f[f.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
        });

        let heroPause = false,
          tx = null;
        document.addEventListener("mouseover", (e) => {
          heroPause = !!e.target.closest("#hero");
        });
        document.addEventListener("focusin", (e) => {
          heroPause = !!e.target.closest("#hero");
        });
        document.addEventListener(
          "touchstart",
          (e) => {
            tx = e.target.closest("#hero") ? e.touches[0].clientX : null;
          },
          { passive: true },
        );
        document.addEventListener("touchend", (e) => {
          if (tx === null) return;
          const dx = e.changedTouches[0].clientX - tx;
          tx = null;
          if (Math.abs(dx) > 40) goHero(ui.slide + (dx < 0 ? 1 : -1));
        });
        setInterval(() => {
          if (
            !$("#hero") ||
            heroPause ||
            ui.modalJobId ||
            document.hidden ||
            matchMedia("(prefers-reduced-motion:reduce)").matches
          )
            return;
          goHero(ui.slide + 1);
        }, 2000);

        function setSafarTheme(theme) {
          const light = theme === "light";
          document.documentElement.dataset.theme = light ? "light" : "dark";
          document.body.dataset.theme = light ? "light" : "dark";
          try {
            localStorage.setItem("safar-theme", light ? "light" : "dark");
          } catch (e) {}
          document
            .querySelectorAll("[data-action=toggle-theme]")
            .forEach((b) => {
              b.setAttribute(
                "aria-label",
                light ? "Switch to dark mode" : "Switch to light mode",
              );
              b.title = light ? "Switch to dark mode" : "Switch to light mode";
              b.innerHTML = light
                ? '<span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Dark mode</span>'
                : '<span class="theme-icon" aria-hidden="true">☼</span><span class="theme-label">Light mode</span>';
            });
        }
        try {
          setSafarTheme(
            localStorage.getItem("safar-theme") === "light" ? "light" : "dark",
          );
        } catch (e) {
          setSafarTheme("dark");
        }
        $("#app").innerHTML = '<p class="muted" style="padding:40px">Loading SAFAR…</p>';
        (async function boot() {
          try {
            auth.meta = await API.meta();
          } catch (e) {}
          if (API.isSignedIn()) {
            try {
              auth.user = await API.me();
            } catch (e) {
              auth.user = null;
            }
          }
          try {
            await loadAll();
          } catch (e) {
            toast("Could not reach the SAFAR server. Please check your connection and refresh.");
          }
          booting = false;
          syncRole();
          ui.filters.sort = isStudent() ? "match" : "new";
          ui.view = isBusiness() ? "dash" : "discover";
          render();
          setInterval(pollInbox, 20000);
        })();
      })();
    </script>
  </body>
</html>
